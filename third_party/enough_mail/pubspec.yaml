name: enough_mail
description: IMAP, POP3 and SMTP for email developers. Choose between a low
  level and a high level API for mailing. Parse and generate MIME messages.
  Discover email settings.
version: 2.1.7
homepage: https://github.com/Enough-Software/enough_mail
topics:
  - email
  - imap
  - pop3
  - smtp
  - mime

# 本地 vendor 说明（AFloat 项目）：
# 上游 pub.dev 2.1.7 的 basic_utils ^5.8.2 会拖入 archive 4.x，
# 与宿主项目 excel/pdf 所需 archive 3.x 冲突；且 basic_utils 5.7.0
# 又依赖 pointycastle 3.x，与 enough_mail 的 pointycastle 4.x 冲突。
# enough_mail 仅在服务器自动发现（discover，宿主不使用）里调用
# basic_utils 的 DnsUtils，故本地移除该依赖并将 MX 查询改为返回 null。
# 其余源码与上游 2.1.7 完全一致。

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.6
  # encrypt: ^5.0.3
  encrypter_plus: ^5.1.0
  enough_convert: ^1.6.0
  event_bus: ^2.0.1
  intl: any
  json_annotation: ^4.9.0
  pointycastle: ^4.0.0
  synchronized: ^3.4.0
  xml: ">=6.0.0 <7.0.0"

dependency_overrides:
  # http: ^1.4.0 # for dart_code_metrics

dev_dependencies:
  build_runner: ^2.6.0
  # dart_code_metrics: 5.7.6
  dart_code_linter: ^3.0.0
  flutter_lints: ^6.0.0
  json_serializable: ^6.10.0
  lints: ^6.0.0
  test: ^1.26.3
  timezone: ^0.10.1
